services:
  postgres:
    image: postgres:16-alpine
    container_name: agendamentos-db
    environment:
      POSTGRES_DB: db_agendamento
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_agendamento"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: agendamentos-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Dentro do container, "localhost" e o proprio container. O host correto
      # e o nome do servico, resolvido pelo DNS interno do Compose.
      # Variavel de ambiente tem precedencia sobre o application.properties.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_agendamento
    ports:
      - "8080:8080"

volumes:
  postgres-data: